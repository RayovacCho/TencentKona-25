name: 'Serialization regression'

on:
  push:
    branches:
      - codex/task-2.2-serialization
    paths:
      - 'src/java.base/share/classes/java/io/**'
      - 'test/jdk/java/io/**'
      - '.github/workflows/serialization-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serialization-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v6

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64

      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

      - name: 'Install build dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            libasound2-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev \
            libxtst-dev \
            zip

      - name: 'Configure release build'
        run: >
          bash configure
          --with-conf-name=linux-x64-serialization
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-jtreg=${{ github.workspace }}/jtreg/installed
          --with-debug-level=release
          --disable-warnings-as-errors

      - name: 'Build JDK and test support'
        run: >
          make CONF=linux-x64-serialization
          images build-test-lib test-image-jdk-jtreg-native

      - name: 'Run serialization regression tests'
        run: >
          make CONF=linux-x64-serialization test-only
          TEST='test/jdk/java/io/Serializable test/jdk/java/io/Externalizable test/jdk/java/io/ObjectInputStream test/jdk/java/io/ObjectStreamClass'
          JTREG='JOBS=4;TIMEOUT_FACTOR=4;VERBOSE=fail,error,time'
